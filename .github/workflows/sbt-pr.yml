name: SBT CI

permissions:
  contents: read

on:
  pull_request:
    branches: ["*"]

jobs:
  call-sbt-ci:
    uses: project-ncl/shared-github-actions/.github/workflows/sbt-ci.yml@461b242bf215856b94e7b40f1ecfa06f7ebb1b45 # v0.0.26
    with:
      build_args: "clean; compile; +test; makePom; scripted smeg-plugin/*"
      upload_artifacts: true
