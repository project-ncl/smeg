name: SBT CI

permissions:
  contents: read

on:
  pull_request:
    branches: ["*"]

jobs:
  call-sbt-ci:
    uses: project-ncl/shared-github-actions/.github/workflows/sbt-ci.yml@9735924b878ff3890cfaf16acb28e06531963ebf # v0.0.25
    with:
      build_args: "clean; compile; +test; makePom; scripted smeg-plugin/*"
      upload_artifacts: true
