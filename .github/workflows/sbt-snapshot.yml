name: Build snapshot version and upload

permissions:
  contents: read

on:
  push:
    branches: ["main"]

jobs:
  call-snapshot-job:
    uses: project-ncl/shared-github-actions/.github/workflows/sbt-snapshot.yml@f0ec1696c5dfea0d6d16c135c14f54049b94edaf # v0.0.24
    with:
      project_name: "project-ncl/smeg"
      build_args: "clean; compile; +test; scripted smeg-plugin/*"
      snapshot_deploy_command: "sbt -v aetherDeploy"
    secrets:
      SNAPSHOT_USER: ${{ secrets.SONATYPE_USERNAME }}
      SNAPSHOT_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
