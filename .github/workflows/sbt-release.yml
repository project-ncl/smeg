name: "0 Central Release Job" # Adding the 0 so that it's on top of the list of github actions

permissions:
  contents: write # Allows pushing tags and commits

on:
  workflow_dispatch: # Manual trigger so you don't release on every push
    inputs:
      ref_to_release:
        description: '[Optional] Branch to release. Default: Github default branch'
        required: false
        type: string
        # default has to be a static string, no variables allowed
        default: ''
      release_version:
        description: '[Optional] Version to release. Default: the version in version.sbt without -SNAPSHOT'
        required: false
        type: string
        default: ''
      next_version:
        description: '[Optional] Next snapshot version. Default: the released version with its last number incremented'
        required: false
        type: string
        default: ''
      additional_release_args:
        description: '[Optional] Extra sbt-release arguments, e.g. skip-tests'
        required: false
        type: string
        default: ''

# queue, don't cancel, a second release of the same ref: cancelling a run midway (e.g. after sonaRelease, before
# pushChanges) would leave a version published on Maven Central without its tag and version commits
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  call-sbt-release:
    uses: project-ncl/shared-github-actions/.github/workflows/sbt-release.yml@af62bc3c8181df77581ddf64859f9bba9129fcad # main, includes setup-sbt v1.5.14 in sbt-release.yml and sbt-build
    with:
      project_name: "project-ncl/smeg"
      ref_to_release: ${{ inputs.ref_to_release }}
      release_version: ${{ inputs.release_version }}
      next_version: ${{ inputs.next_version }}
      additional_release_args: ${{ inputs.additional_release_args }}
      java_version: "8"
    secrets:
      SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
      SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
